enable
configure terminal
hostname R0
interface FastEthernet0/1
 ip address 10.0.0.1 255.0.0.0
 no shutdown
 exit
interface Serial0/0/0
 ip address 192.168.1.249 255.255.255.252
 clock rate 64000
 bandwidth 64
 no shutdown
 exit
interface Serial0/0/1
 ip address 192.168.1.254 255.255.255.252
 clock rate 64000
 bandwidth 64
 no shutdown
 exit
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.1.0
 exit
end
copy running-config startup-config
